{% extends "base.html" %}
{% block title %}{{ post.title }} · Jake Ford{% endblock %}
{% block content %}
<a href="../index.html" class="back-link">← all posts</a>
<div class="post-header">
  <h1>{{ post.title }}</h1>
  <div class="post-meta">{{ post.date }}{% if post.description %} · {{ post.description }}{% endif %}</div>
</div>
<div class="content">
  {{ post.content }}
</div>
{% endblock %}
